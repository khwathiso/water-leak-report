<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account | Pretoria Municipality Water Services</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            water: {
              50: "#f0f9ff",
              100: "#e0f2fe",
              200: "#bae6fd",
              400: "#38bdf8",
              500: "#0ea5e9",
              600: "#0284c7",
              700: "#0369a1",
              800: "#075985",
              900: "#0c4a6e"
            }
          }
        }
      }
    };
  </script>
</head>
<body class="flex min-h-screen flex-col bg-slate-100 font-sans text-slate-800">
  <header class="bg-water-700 text-white shadow-md">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-4 py-4">
      <div>
        <p id="site-title" class="text-lg font-bold tracking-tight">Pretoria Municipality &mdash; Water Services</p>
        <p class="text-xs text-water-100">Water Leak Reporting Portal</p>
      </div>
    </div>
  </header>

  <main class="mx-auto flex w-full max-w-6xl flex-1 items-start justify-center px-4 py-10">
    <section class="w-full max-w-lg rounded-lg bg-white p-6 shadow">
      <h1 id="page-heading" class="text-xl font-bold text-water-900">Create your account</h1>
      <p class="mb-5 mt-1 text-sm text-slate-600">Register as a resident to report and track water leaks.</p>

      <div id="register-error" data-testid="register-error" class="mb-4 hidden rounded border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></div>

      <form id="register-form" data-testid="register-form" novalidate class="space-y-4">
        <div>
          <label for="register-username" class="mb-1 block text-sm font-medium text-slate-700">Username</label>
          <input id="register-username" name="username" data-testid="input-register-username" type="text"
            autocomplete="username" placeholder="3-20 letters, numbers or underscore"
            class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-water-500 focus:outline-none focus:ring-2 focus:ring-water-200" />
          <p id="register-username-error" data-testid="error-register-username" class="mt-1 hidden text-sm text-red-600"></p>
        </div>
        <div>
          <label for="register-email" class="mb-1 block text-sm font-medium text-slate-700">Email address</label>
          <input id="register-email" name="email" data-testid="input-register-email" type="email"
            autocomplete="email" placeholder="you@example.com"
            class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-water-500 focus:outline-none focus:ring-2 focus:ring-water-200" />
          <p id="register-email-error" data-testid="error-register-email" class="mt-1 hidden text-sm text-red-600"></p>
        </div>
        <div>
          <label for="register-password" class="mb-1 block text-sm font-medium text-slate-700">Password</label>
          <input id="register-password" name="password" data-testid="input-register-password" type="password"
            autocomplete="new-password" placeholder="At least 6 characters"
            class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-water-500 focus:outline-none focus:ring-2 focus:ring-water-200" />
          <p id="register-password-error" data-testid="error-register-password" class="mt-1 hidden text-sm text-red-600"></p>
        </div>
        <div>
          <label for="register-confirm" class="mb-1 block text-sm font-medium text-slate-700">Confirm password</label>
          <input id="register-confirm" name="confirm" data-testid="input-register-confirm" type="password"
            autocomplete="new-password" placeholder="Re-enter your password"
            class="w-full rounded border border-slate-300 px-3 py-2 text-sm focus:border-water-500 focus:outline-none focus:ring-2 focus:ring-water-200" />
          <p id="register-confirm-error" data-testid="error-register-confirm" class="mt-1 hidden text-sm text-red-600"></p>
        </div>
        <button id="register-button" data-testid="register-button" type="submit"
          class="w-full rounded bg-water-600 px-6 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-water-700 focus:outline-none focus:ring-2 focus:ring-water-400 disabled:cursor-not-allowed disabled:opacity-60">
          Create account
        </button>
      </form>

      <p class="mt-5 text-sm text-slate-600">
        Already registered?
        <a id="goto-signin" href="signin.html" data-testid="goto-signin" class="font-semibold text-water-700 hover:underline">Sign in</a>
      </p>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-4">
    <p class="mx-auto max-w-6xl px-4 text-center text-xs text-slate-500">
      &copy; 2026 Pretoria Municipality Water Services &mdash; demo application for testing purposes.
    </p>
  </footer>

  <div id="toast-container" data-testid="toast-container" class="pointer-events-none fixed right-4 top-4 z-50 flex w-80 flex-col gap-2"></div>

  <script src="js/shared.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
